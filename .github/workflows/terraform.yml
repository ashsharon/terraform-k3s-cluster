name: Terraform

on:
  push:
    branches: [main]
    paths: ["**.tf", "**.tftpl", ".github/workflows/terraform.yml"]
  pull_request:
    paths: ["**.tf", "**.tftpl", ".github/workflows/terraform.yml"]

jobs:
  fmt-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform fmt (check only)
        run: terraform fmt -check -recursive

      - name: terraform init (no backend, no real credentials needed)
        run: |
          set +e
          out=$(terraform init -backend=false 2>&1)
          code=$?
          set -e
          echo "$out"
          if [ $code -ne 0 ]; then
            esc="${out//'%'/'%25'}"
            esc="${esc//$'\n'/'%0A'}"
            esc="${esc//$'\r'/'%0D'}"
            echo "::error::terraform init output:%0A${esc}"
            exit $code
          fi

      - name: terraform validate
        run: terraform validate

  plan:
    runs-on: ubuntu-latest
    needs: fmt-and-validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: terraform init
        run: terraform init
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}

      - name: terraform plan
        run: terraform plan -no-color
        env:
          TF_VAR_hcloud_token: ${{ secrets.HCLOUD_TOKEN }}
          TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
