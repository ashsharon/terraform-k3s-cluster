# k3s ships Traefik as its default ingress controller, so no extra
# controller install is needed — this just needs a real host to point DNS
# at. Swap host for your own domain, or test locally with:
#   curl -H "Host: demo.example.com" http://<node-ip>/
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: demo-app
  namespace: demo-app
spec:
  ingressClassName: traefik
  rules:
    - host: demo.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: demo-app
                port:
                  name: http
